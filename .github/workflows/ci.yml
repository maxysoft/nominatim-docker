name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only pull requests: cancelling a push run could stop publish between
  # its registry pushes and leave the tags inconsistent.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The Makefile holds the digest-pinned golang, hadolint and shellcheck
      # images, so CI and local runs cannot drift apart.
      - run: make vet test fmt-check lint

  build:
    name: Build docker image
    # Requires the bracketed marker. A bare `skip_build` matches anywhere in the
    # message, including the body, so a commit that merely mentions the flag
    # silently skips the whole matrix, and the run still reports green, because
    # skipped jobs do not fail. That hid a broken CI from 2026-04-22 onwards.
    if: ${{ !contains(github.event.head_commit.message, '[skip_build]') }}

    runs-on: ubuntu-latest
    outputs:
      NOMINATIM_VERSION: ${{ steps.get_version.outputs.NOMINATIM_VERSION }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Extract Nominatim Version
        id: get_version
        run: echo "NOMINATIM_VERSION=$(grep -oP '(?<=ARG NOMINATIM_VERSION=)[0-9.]+' Dockerfile)" >> $GITHUB_OUTPUT

      - name: Build and export image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          tags: nominatim:${{ steps.get_version.outputs.NOMINATIM_VERSION }}
          outputs: type=docker,dest=/tmp/nominatim.tar
          # Read back by publish, so the amd64 layers it pushes are the ones tested.
          cache-from: type=gha,scope=full
          cache-to: type=gha,scope=full,mode=max

      # The slim serve target must at least keep building; its behaviour
      # (refusing imports, serving an existing database read-only) is asserted
      # by the integration job (test/integration.sh serve_image).
      - name: Build serve target
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: serve
          tags: nominatim:${{ steps.get_version.outputs.NOMINATIM_VERSION }}-serve
          cache-from: type=gha,scope=serve
          cache-to: type=gha,scope=serve,mode=max

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nominatim-${{ steps.get_version.outputs.NOMINATIM_VERSION }}
          path: /tmp/nominatim.tar

  test:
    name: Test docker image
    needs: build
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      NOMINATIM_VERSION: ${{ needs.build.outputs.NOMINATIM_VERSION }}
      POSTGRES_PASSWORD: very_secure_password

    # Each scenario runs on its own runner: start-postgres and run-nominatim
    # use fixed names and port 8080, and nothing needs cleaning up.
    strategy:
      fail-fast: false
      matrix:
        test_scenario:
          # Also covers a plain PBF_URL import followed by an update.
          - name: Import with persistent data and container restart
            commands: |-
              ./start-postgres
              
              # get the data from four days ago to make sure there really are updates to apply
              four_days_ago=`date --date="4 days ago" +%y%m%d`
              ./run-nominatim \
                -e PBF_URL=https://download.geofabrik.de/europe/monaco-${four_days_ago}.osm.pbf \
                -e REPLICATION_URL=https://download.geofabrik.de/europe/monaco-updates/ &

              ./assert-json "http://localhost:8080/search.php?q=avenue%20pasteur"
              ./assert-json "http://localhost:8080/status.php?format=json"
              
              # Stop and remove, so the second run can take the name; the
              # nominatim-data volume carries the project dir over.
              docker stop nominatim
              docker wait nominatim
              docker rm nominatim

              # Start nominatim again with same database
              ./run-nominatim \
                -e PBF_URL=https://download.geofabrik.de/europe/monaco-${four_days_ago}.osm.pbf \
                -e REPLICATION_URL=https://download.geofabrik.de/europe/monaco-updates/ &

              ./assert-json "http://localhost:8080/search.php?q=avenue%20pasteur"
              # The second start must reuse the import, not run it again.
              ./wait-log "existing Nominatim import found"
              docker exec -i -u nominatim nominatim nominatim replication --project-dir /nominatim --once
              ./assert-json "http://localhost:8080/search.php?q=avenue%20pasteur"

          - name: UPDATE_MODE=once
            commands: |-
              ./start-postgres
              
              # get the data from four days ago to make sure there really are updates to apply
              four_days_ago=`date --date="4 days ago" +%y%m%d`
              ./run-nominatim \
                -e PBF_URL=https://download.geofabrik.de/europe/monaco-${four_days_ago}.osm.pbf \
                -e REPLICATION_URL=https://download.geofabrik.de/europe/monaco-updates/ \
                -e UPDATE_MODE=once &

              ./assert-json "http://localhost:8080/search.php?q=avenue%20pasteur"
              ./assert-json "http://localhost:8080/status.php?format=json"
              # Replication output goes to the container's stdout now, not to an
              # unrotated /var/log/replication.log inside the container.
              ./wait-log "Update completed."

          - name: UPDATE_MODE=continuous
            commands: |-
              ./start-postgres
              
              # get the data from few days ago to make sure there really are updates to apply
              days_ago=`date --date="4 days ago" +%y%m%d`
              ./run-nominatim \
                -e PBF_URL=https://download.geofabrik.de/europe/monaco-${days_ago}.osm.pbf \
                -e REPLICATION_URL=https://download.geofabrik.de/europe/monaco-updates/ \
                -e UPDATE_MODE=continuous &

              ./assert-json "http://localhost:8080/search.php?q=avenue%20pasteur"
              ./assert-json "http://localhost:8080/status.php?format=json"
              # Replication output goes to the container's stdout now, not to an
              # unrotated /var/log/replication.log inside the container.
              ./wait-log "Update completed."

          - name: Import admin style
            commands: |-
              ./start-postgres
              
              ./run-nominatim \
                -e PBF_URL=https://download.geofabrik.de/europe/monaco-latest.osm.pbf \
                -e REPLICATION_URL=https://download.geofabrik.de/europe/monaco-updates/ \
                -e IMPORT_STYLE=admin &

              # First the long-retry check, which covers the import itself.
              ./assert-json "http://localhost:8080/status.php?format=json"
              ./assert-json "http://localhost:8080/search.php?q=hotel%20de%20paris" --empty
              # Admin style keeps boundaries, so search must still find them.
              ./assert-json "http://localhost:8080/search.php?q=Monaco&format=json&limit=1" "class" "^boundary$"

          - name: Import with PBF_PATH
            commands: |-
              ./start-postgres
              
              wget --cut-dirs=1 -nH -xP /tmp/data https://download.geofabrik.de/europe/monaco-latest.osm.pbf
              ./run-nominatim \
                -e PBF_PATH=/nominatim/data/monaco-latest.osm.pbf \
                -e REPLICATION_URL=https://download.geofabrik.de/europe/monaco-updates/ \
                -v /tmp/data:/nominatim/data &

              ./assert-json "http://localhost:8080/search.php?q=avenue%20pasteur"
              ./assert-json "http://localhost:8080/status.php?format=json"

          - name: FREEZE
            commands: |-
              ./start-postgres
              
              ./run-nominatim \
                -e PBF_URL=https://download.geofabrik.de/europe/monaco-latest.osm.pbf \
                -e FREEZE="true" &

              ./assert-json "http://localhost:8080/search.php?q=avenue%20pasteur"
              ./assert-json "http://localhost:8080/status.php?format=json"

          - name: GB postcode import
            commands: |-
              ./start-postgres
              
              ./run-nominatim \
                -e PBF_URL=https://download.geofabrik.de/europe/united-kingdom/england/rutland-latest.osm.pbf \
                -e IMPORT_GB_POSTCODES="true" &

              ./assert-json "http://localhost:8080/search.php?postalcode=LE15+8TX"
              ./assert-json "http://localhost:8080/status.php?format=json"
              # PE9 3SY was retired from the ONS dataset and is absent from the current
              # gb_postcodes.csv.gz; PE9 3AL is the nearest surviving PE9 3* postcode.
              ./assert-json "http://localhost:8080/search.php?postalcode=PE9+3AL"
              ./assert-json "http://localhost:8080/search.php?postalcode=PE9+4ES"

          - name: REVERSE_ONLY
            commands: |-
              ./start-postgres
              
              ./run-nominatim \
                -e PBF_URL=https://download.geofabrik.de/europe/monaco-latest.osm.pbf \
                -e REVERSE_ONLY="true" &

              ./assert-json "http://localhost:8080/reverse.php?lat=43.734&lon=7.42&format=jsonv2"
              ./assert-json "http://localhost:8080/reverse.php?lat=43.7314&lon=7.4197&format=jsonv2" "display_name" "Monaco"
              ./assert-json "http://localhost:8080/status.php?format=json"

          # Also covers a blank REPLICATION_URL and the WARMUP_ON_STARTUP=false default.
          - name: Check for clean shutdown
            commands: |-
              ./start-postgres
              
              ./run-nominatim --detach \
                -e PBF_URL=https://download.geofabrik.de/europe/monaco-latest.osm.pbf
            
              ./assert-json "http://localhost:8080/search.php?q=avenue%20pasteur"
              ./assert-json "http://localhost:8080/status.php?format=json"
              ./wait-log "Skipping cache warmup"
              # Shutdown the container
              docker stop -t 60 nominatim
              # Verify that the exit code is zero
              CONTAINER_EXIT_CODE=$(docker inspect nominatim --format='{{.State.ExitCode}}')
              test "$CONTAINER_EXIT_CODE" -eq 0

          - name: WARMUP_ON_STARTUP=true
            commands: |-
              ./start-postgres
              
              ./run-nominatim \
                -e PBF_URL=https://download.geofabrik.de/europe/monaco-latest.osm.pbf \
                -e WARMUP_ON_STARTUP=true &

              ./assert-json "http://localhost:8080/search.php?q=avenue%20pasteur"
              ./assert-json "http://localhost:8080/status.php?format=json"
              ./wait-log "Warming finished"

          # Also covers the default (full) import style and a volume-mounted project dir.
          - name: API endpoints coverage
            commands: |-
              ./start-postgres
              
              ./run-nominatim \
                -e PBF_URL=https://download.geofabrik.de/europe/monaco-latest.osm.pbf \
                -e REPLICATION_URL=https://download.geofabrik.de/europe/monaco-updates/ &

              # /status endpoint: verify service is up, status=0, and version matches
              ./assert-json "http://localhost:8080/status.php?format=json"
              ./assert-json "http://localhost:8080/status.php?format=json" "status" "^0$"
              ./assert-json "http://localhost:8080/status.php?format=json" "software_version" "^5\."
              ./assert-json "http://localhost:8080/status.php?format=json" "database_version" "^5\."

              # /search endpoint: verify avenue pasteur returns results
              ./assert-json "http://localhost:8080/search.php?q=avenue%20pasteur"
              # the full style imports POIs; admin style asserts the opposite
              ./assert-json "http://localhost:8080/search.php?q=hotel%20de%20paris"
              # verify Monaco country result has correct place_rank and class
              ./assert-json "http://localhost:8080/search.php?q=Monaco&format=json&limit=1" "name" "^Monaco$"
              ./assert-json "http://localhost:8080/search.php?q=Monaco&format=json&limit=1" "class" "^boundary$"
              ./assert-json "http://localhost:8080/search.php?q=Monaco&format=json&limit=1" "place_rank" "^4$"
              # verify addressdetails returns country field
              ./assert-json "http://localhost:8080/search.php?q=avenue%20pasteur&format=json&limit=1&addressdetails=1" "address.country" "Monaco"
              # verify polygon_geojson is returned
              ./assert-json "http://localhost:8080/search.php?q=Monaco&format=json&limit=1&polygon_geojson=1" "geojson.type" "olygon"
              # verify structured query (city+country) returns results
              ./assert-json "http://localhost:8080/search.php?city=Monaco&country=Monaco&format=json" "place_id" "."

              # /reverse endpoint: verify Palace of Monaco resolves to Monaco
              ./assert-json "http://localhost:8080/reverse.php?lat=43.734&lon=7.42&format=json"
              ./assert-json "http://localhost:8080/reverse.php?lat=43.7314&lon=7.4197&format=json" "display_name" "Monaco"
              ./assert-json "http://localhost:8080/reverse.php?lat=43.7314&lon=7.4197&format=json" "address.country" "Monaco"

              # /lookup endpoint: verify OSM way and Monaco country relation
              ./assert-json "http://localhost:8080/lookup.php?osm_ids=W201009264&format=json"
              ./assert-json "http://localhost:8080/lookup.php?osm_ids=R1124039&format=json" "osm_type" "^relation$"
              ./assert-json "http://localhost:8080/lookup.php?osm_ids=R1124039&format=json" "name" "^Monaco$"

              # /details endpoint: verify Monaco country via osmtype+osmid
              ./assert-json "http://localhost:8080/details.php?osmtype=R&osmid=1124039&format=json" "localname" "^Monaco$"
              ./assert-json "http://localhost:8080/details.php?osmtype=R&osmid=1124039&format=json" "category" "^boundary$"

              # verify Content-Type: application/json header. GET, not HEAD:
              # Nominatim answers HEAD with a 405 whose error body is JSON too.
              CT=$(curl -s -o /dev/null -w '%{content_type}' "http://localhost:8080/search.php?q=Monaco&format=json")
              case "$CT" in
                application/json*) echo "✅ Content-Type: $CT" ;;
                *) echo "FAIL: Content-Type header: $CT"; exit 1 ;;
              esac

              # Run database health check inside the container
              docker exec -u nominatim nominatim nominatim admin --check-database --project-dir /nominatim
    
    steps:
      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nominatim-${{ needs.build.outputs.NOMINATIM_VERSION }}
          path: /tmp
      - name: Load image
        run: |
          docker load --input /tmp/nominatim.tar
          docker image ls -a
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Excute the test scenario
      - name: ${{ matrix.test_scenario.name }}
        working-directory: .github/workflows
        run: ${{ matrix.test_scenario.commands }}
  
  # The serve image and the shipped split compose stack are covered only
  # here; the script builds both targets itself.
  integration:
    name: Integration scenarios
    needs: build
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Serve image and split stack
        run: test/integration.sh serve_image split drop_guard

  publish:
    name: Publish docker image
    needs: [static, test, integration]
    runs-on: ubuntu-latest
    # master publishes the real tags; the test branch publishes the same
    # images with a -test suffix for pre-merge validation.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/test')
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Get commit short reference
        id: get_commit
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      # OCI references must be lowercase; the repository name may not be.
      - name: Lowercase repository
        id: repo
        run: echo "REPO=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Compute tag suffix
        id: get_suffix
        # -test on the test branch, empty on master.
        run: |
          if [ "$GITHUB_REF_NAME" = "test" ]; then
            echo "TAG_SUFFIX=-test" >> "$GITHUB_OUTPUT"
          else
            echo "TAG_SUFFIX=" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract Nominatim Version
        id: get_version
        run: echo "NOMINATIM_VERSION=$(grep -oP '(?<=ARG NOMINATIM_VERSION=)[0-9.]+' Dockerfile)" >> $GITHUB_OUTPUT

      # Verify Dockerfile exists and get build info
      - name: Verify Dockerfile
        run: |
          test -f Dockerfile
          echo "Dockerfile found ✅"
          echo "Nominatim version: ${{ steps.get_version.outputs.NOMINATIM_VERSION }}"
          echo "Commit SHA: ${{ steps.get_commit.outputs.SHORT_SHA }}"

      - name: Login to Docker Hub
        if: ${{ github.repository_owner == 'maxysoft' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Each push reads the build job's cache: on a hit, the amd64 image
      # pushed is layer for layer the one the tests ran. arm64 is built here
      # and is not tested.
      - name: Build and push to Docker Hub
        if: ${{ github.repository_owner == 'maxysoft' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=full
          tags: |
            ${{ steps.repo.outputs.REPO }}:v${{ steps.get_version.outputs.NOMINATIM_VERSION }}-${{ steps.get_commit.outputs.SHORT_SHA }}${{ steps.get_suffix.outputs.TAG_SUFFIX }}
            ${{ steps.repo.outputs.REPO }}:latest${{ steps.get_suffix.outputs.TAG_SUFFIX }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
            org.opencontainers.image.version=${{ steps.get_version.outputs.NOMINATIM_VERSION }}

      - name: Build and push serve image to Docker Hub
        if: ${{ github.repository_owner == 'maxysoft' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: serve
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=serve
          tags: |
            ${{ steps.repo.outputs.REPO }}:v${{ steps.get_version.outputs.NOMINATIM_VERSION }}-${{ steps.get_commit.outputs.SHORT_SHA }}-serve${{ steps.get_suffix.outputs.TAG_SUFFIX }}
            ${{ steps.repo.outputs.REPO }}:serve${{ steps.get_suffix.outputs.TAG_SUFFIX }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
            org.opencontainers.image.version=${{ steps.get_version.outputs.NOMINATIM_VERSION }}

      - name: Build and push to GitHub Container Registry
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=full
          tags: |
            ghcr.io/${{ steps.repo.outputs.REPO }}:v${{ steps.get_version.outputs.NOMINATIM_VERSION }}-${{ steps.get_commit.outputs.SHORT_SHA }}${{ steps.get_suffix.outputs.TAG_SUFFIX }}
            ghcr.io/${{ steps.repo.outputs.REPO }}:latest${{ steps.get_suffix.outputs.TAG_SUFFIX }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
            org.opencontainers.image.version=${{ steps.get_version.outputs.NOMINATIM_VERSION }}

      - name: Build and push serve image to GitHub Container Registry
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: serve
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=serve
          tags: |
            ghcr.io/${{ steps.repo.outputs.REPO }}:v${{ steps.get_version.outputs.NOMINATIM_VERSION }}-${{ steps.get_commit.outputs.SHORT_SHA }}-serve${{ steps.get_suffix.outputs.TAG_SUFFIX }}
            ghcr.io/${{ steps.repo.outputs.REPO }}:serve${{ steps.get_suffix.outputs.TAG_SUFFIX }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
            org.opencontainers.image.version=${{ steps.get_version.outputs.NOMINATIM_VERSION }}
