x-logging: &logging
  logging:
    driver: "json-file"
    options:
      max-size: 10m
      max-file: "3"

services:
  nominatim-postgres:
    image: postgis/postgis:18-3.6-alpine@sha256:ffcf0c4b904e41b9779f8098007fb5a9484025319c18c70cf8e1bcebb742b9b7
    container_name: nominatim-postgres
    hostname: nominatim-postgres
    restart: unless-stopped
    # PostgreSQL uses /dev/shm for parallel workers; the 64MB default is
    # too small for an import. The API container does not need it.
    shm_size: 1gb
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?set POSTGRES_ADMIN_PASSWORD in .env}
      POSTGRES_USER: postgres
      POSTGRES_DB: nominatim
    volumes:
      - type: volume
        source: postgres-data
        target: /var/lib/postgresql
      - type: bind
        source: ./postgres/postgresql-local.conf
        target: /etc/postgresql/postgresql.conf
        read_only: true
    # PostgreSQL configuration optimized for 512 MB RAM machine
    command: >
      postgres -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    <<: *logging
    networks:
      - nominatim-net

  nominatim:
    build:
      context: ..
      dockerfile: Dockerfile
    image: nominatim:local
    container_name: nominatim-local
    hostname: nominatim-local
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # External database configuration
      POSTGRES_HOST: nominatim-postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: nominatim
      NOMINATIM_PASSWORD: ${NOMINATIM_PASSWORD:?set NOMINATIM_PASSWORD in .env}
      POSTGRES_ADMIN_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?set POSTGRES_ADMIN_PASSWORD in .env}
      
      # Nominatim configuration
      # see https://github.com/maxysoft/nominatim-docker/tree/master/5.3#configuration for more options
      PBF_URL: https://download.geofabrik.de/europe/monaco-latest.osm.pbf
      REPLICATION_URL: https://download.geofabrik.de/europe/monaco-updates/

      # Supplementary datasets (Wikipedia importance, GB/US postcodes, Tiger) are
      # fetched over HTTPS from nominatim.org. Set the IMPORT_* switches to "true"
      # to enable them, or point DATA_MIRROR_URL at your own mirror.
      # DATA_MIRROR_URL: https://nominatim.org/data
    # No setuid binary remains in the image, so privilege escalation can be
    # blocked outright. The retained capabilities are what the entrypoint needs
    # to take ownership of the volume and drop to the unprivileged user.
    # Reap orphaned processes; the entrypoint deliberately does not.
    init: true
    security_opt:
      - no-new-privileges:true
    # Nothing outside /nominatim (volume), /tmp and $HOME (tmpfs below), and
    # /dev/shm is ever written, so the root filesystem can be immutable.
    read_only: true
    tmpfs:
      - /tmp
      - /var/lib/nominatim
    cap_drop:
      - ALL
    cap_add:
      # KILL is required: the entrypoint runs as uid 0 and signals children it
      # forked as uid 1000, which the kernel otherwise denies (EPERM).
      - KILL
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    volumes:
      - nominatim-data:/nominatim
    depends_on:
      nominatim-postgres:
        condition: service_healthy
        restart: true
    <<: *logging
    networks:
      - nominatim-net

volumes:
  postgres-data:
  nominatim-data:

networks:
  nominatim-net:
    name: nominatim-net
