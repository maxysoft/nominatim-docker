# Built from this checkout. No fixed names: test/integration.sh runs this file
# under its own project next to a developer's copy.
#
# nominatim-import (full image) provisions and imports, then exits; nominatim
# (serve image) runs the API with no import tooling or admin credentials;
# nominatim-updater (--profile updates) applies replication diffs. Re-running
# `up` is safe. To import a newer extract into the same database:
#
#   docker compose -f contrib/docker-compose-local.yml run --rm nominatim-import reimport

x-logging: &logging
  logging:
    driver: "json-file"
    options:
      max-size: 10m
      max-file: "3"

# Hardening shared by every nominatim-ctl container: no setuid binaries remain,
# so privilege escalation is blocked; the capabilities are what the entrypoint
# needs to own the volume, drop privileges and signal its children; only
# /nominatim, /tmp, $HOME (tmpfs) and /dev/shm are written.
x-nominatim: &nominatim
  init: true
  security_opt:
    - no-new-privileges:true
  read_only: true
  tmpfs:
    - /tmp
    - /var/lib/nominatim
  cap_drop:
    - ALL
  cap_add:
    - KILL
    - CHOWN
    - DAC_OVERRIDE
    - FOWNER
    - SETUID
    - SETGID
  networks:
    - nominatim-net
  <<: *logging

# Database connection shared by every nominatim-ctl container.
x-database: &database
  POSTGRES_HOST: nominatim-postgres
  POSTGRES_PORT: 5432
  POSTGRES_DB: nominatim
  NOMINATIM_PASSWORD: ${NOMINATIM_PASSWORD:?set NOMINATIM_PASSWORD in .env}

# The full image, used by the import and the updater.
x-full-image: &full-image
  build:
    context: ..
    dockerfile: Dockerfile
  image: nominatim:local

# Shared by import and updater: both write it into the .env on their common volume.
x-replication: &replication
  REPLICATION_URL: https://download.geofabrik.de/europe/monaco-updates/

services:
  nominatim-postgres:
    image: postgis/postgis:18-3.6-alpine@sha256:ffcf0c4b904e41b9779f8098007fb5a9484025319c18c70cf8e1bcebb742b9b7
    restart: unless-stopped
    # PostgreSQL uses /dev/shm for parallel workers; the 64MB default is
    # too small for an import. The API container does not need it.
    shm_size: 1gb
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?set POSTGRES_ADMIN_PASSWORD in .env}
      POSTGRES_USER: postgres
      POSTGRES_DB: nominatim
    volumes:
      - type: volume
        source: postgres-data
        target: /var/lib/postgresql
      - type: bind
        source: ./postgres/postgresql-local.conf
        target: /etc/postgresql/postgresql.conf
        read_only: true
    # Small local configuration; see postgres/postgresql-local.conf.
    command: >
      postgres -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    <<: *logging
    networks:
      - nominatim-net

  # Runs once. The image healthcheck probes the API, which this container never runs.
  nominatim-import:
    <<: [*nominatim, *full-image]
    command: import
    restart: "no"
    healthcheck:
      disable: true
    environment:
      <<: [*database, *replication]
      POSTGRES_ADMIN_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?set POSTGRES_ADMIN_PASSWORD in .env}
      # see https://github.com/maxysoft/nominatim-docker/blob/master/howto.md#configuration for more options
      PBF_URL: https://download.geofabrik.de/europe/monaco-latest.osm.pbf
      # Supplementary datasets (Wikipedia importance, GB/US postcodes, Tiger) are
      # fetched over HTTPS from nominatim.org. Set the IMPORT_* switches to "true"
      # to enable them, or point DATA_MIRROR_URL at your own mirror.
      # DATA_MIRROR_URL: https://nominatim.org/data
    volumes:
      - nominatim-data:/nominatim
    depends_on:
      nominatim-postgres:
        condition: service_healthy

  # Serve image: no osm2pgsql, no psql, no admin credentials. Own volume: it
  # would otherwise overwrite the .env the updater reads.
  nominatim:
    <<: *nominatim
    build:
      context: ..
      dockerfile: Dockerfile
      target: serve
    image: nominatim:local-serve
    restart: unless-stopped
    ports:
      - "${NOMINATIM_PORT:-8080}:8080"
    environment:
      <<: *database
    volumes:
      - nominatim-serve-data:/nominatim
    depends_on:
      nominatim-postgres:
        condition: service_healthy
        restart: true
      nominatim-import:
        condition: service_completed_successfully

  # Optional (--profile updates). on-failure: once/catch-up exit 0 when done.
  nominatim-updater:
    <<: [*nominatim, *full-image]
    profiles:
      - updates
    command: replicate
    restart: on-failure
    healthcheck:
      disable: true
    environment:
      <<: [*database, *replication]
      UPDATE_MODE: continuous
    volumes:
      - nominatim-data:/nominatim
    depends_on:
      nominatim-postgres:
        condition: service_healthy
        restart: true
      nominatim-import:
        condition: service_completed_successfully

volumes:
  postgres-data:
  nominatim-data:
  nominatim-serve-data:

networks:
  nominatim-net:
