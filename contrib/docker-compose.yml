# nominatim-import (full image) provisions and imports, then exits; nominatim
# (serve image) runs the API with no import tooling or admin credentials;
# nominatim-updater (--profile updates) applies replication diffs. Re-running
# `up` is safe. To import a newer extract into the same database:
#
#   docker compose -f contrib/docker-compose.yml run --rm nominatim-import reimport

x-logging: &logging
  logging:
    driver: "json-file"
    options:
      max-size: 10m
      max-file: "3"

# Hardening shared by every nominatim-ctl container: no setuid binaries remain,
# so privilege escalation is blocked; the capabilities are what the entrypoint
# needs to own the volume, drop privileges and signal its children; only
# /nominatim, /tmp, $HOME (tmpfs) and /dev/shm are written.
x-nominatim: &nominatim
  init: true
  # Docker's 10 s default would SIGKILL Gunicorn mid-drain and replication
  # mid-diff; keep it above GUNICORN_GRACEFUL_TIMEOUT + 5 s.
  stop_grace_period: 40s
  security_opt:
    - no-new-privileges:true
  read_only: true
  tmpfs:
    - /tmp
    - /var/lib/nominatim
  cap_drop:
    - ALL
  cap_add:
    - KILL
    - CHOWN
    - DAC_OVERRIDE
    - FOWNER
    - SETUID
    - SETGID
  networks:
    - nominatim-net
  <<: *logging

# Database connection shared by every nominatim-ctl container.
x-database: &database
  POSTGRES_HOST: nominatim-postgres
  POSTGRES_PORT: 5432
  POSTGRES_DB: nominatim
  NOMINATIM_PASSWORD: ${NOMINATIM_PASSWORD:?set NOMINATIM_PASSWORD in .env}
  # Separate, so the read-only API role cannot log in as the owning role.
  NOMINATIM_WEBUSER_PASSWORD: ${NOMINATIM_WEBUSER_PASSWORD:?set NOMINATIM_WEBUSER_PASSWORD in .env}

# Shared by import and updater: both regenerate the .env on their common volume
# from their own environment on every start, so project options from
# howto.md#configuration (IMPORT_STYLE, REPLICATION_*, ...) belong here.
x-replication: &replication
  REPLICATION_URL: https://download.geofabrik.de/europe/monaco-updates/
  # Import and updater indexing threads, one database connection each.
  THREADS: 8

# The full image, as the import and the updater run it. The image healthcheck
# probes the API, which neither container runs.
x-full: &full
  image: ghcr.io/maxysoft/nominatim-docker:latest
  healthcheck:
    disable: true
  volumes:
    - nominatim-data:/nominatim

# The API and the updater wait for a healthy database and a finished import.
x-after-import: &after-import
  nominatim-postgres:
    condition: service_healthy
    restart: true
  nominatim-import:
    condition: service_completed_successfully

services:
  nominatim-postgres:
    image: postgis/postgis:18-3.6-alpine@sha256:ffcf0c4b904e41b9779f8098007fb5a9484025319c18c70cf8e1bcebb742b9b7
    container_name: nominatim-postgres
    hostname: nominatim-postgres
    restart: unless-stopped
    # PostgreSQL uses /dev/shm for parallel workers; the 64MB default is
    # too small for an import. The API container does not need it.
    shm_size: 1gb
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?set POSTGRES_ADMIN_PASSWORD in .env}
      POSTGRES_USER: postgres
      POSTGRES_DB: nominatim
    volumes:
      - type: volume
        source: postgres-data
        target: /var/lib/postgresql
      - type: bind
        source: ./postgres/16g-postgresql.conf
        target: /etc/postgresql/postgresql.conf
        read_only: true
    # PostgreSQL configuration optimized for 16 GB RAM machine
    command: >
      postgres -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    <<: *logging
    networks:
      - nominatim-net

  # Runs once.
  nominatim-import:
    <<: [*nominatim, *full]
    container_name: nominatim-import
    command: import
    restart: "no"
    environment:
      <<: [*database, *replication]
      POSTGRES_ADMIN_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?set POSTGRES_ADMIN_PASSWORD in .env}
      # Import-only settings. Project options (howto.md#configuration) go in
      # x-replication above, or the updater drops them from the shared .env.
      PBF_URL: https://download.geofabrik.de/europe/monaco-latest.osm.pbf
      # Supplementary datasets (Wikipedia importance, GB/US postcodes, Tiger) are
      # fetched over HTTPS from nominatim.org. Set the IMPORT_* switches to "true"
      # to enable them, or point DATA_MIRROR_URL at your own mirror.
      # DATA_MIRROR_URL: https://nominatim.org/data
    depends_on:
      nominatim-postgres:
        condition: service_healthy

  # Serve image: no osm2pgsql, no psql, no admin credentials. Own volume: it
  # would otherwise overwrite the .env the updater reads.
  nominatim:
    <<: *nominatim
    image: ghcr.io/maxysoft/nominatim-docker:serve
    container_name: nominatim
    hostname: nominatim
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      <<: *database
      # Each worker holds up to NOMINATIM_API_POOL_SIZE connections, so
      # 8 x 5 + THREADS (8) stays below max_connections (100) in postgres/16g-postgresql.conf.
      GUNICORN_WORKERS: 8
      NOMINATIM_API_POOL_SIZE: 5
    volumes:
      - nominatim-serve-data:/nominatim
    depends_on: *after-import

  # Optional (--profile updates). on-failure: once/catch-up exit 0 when done.
  nominatim-updater:
    <<: [*nominatim, *full]
    profiles:
      - updates
    container_name: nominatim-updater
    command: replicate
    restart: on-failure
    environment:
      <<: [*database, *replication]
      UPDATE_MODE: continuous
    depends_on: *after-import

volumes:
  postgres-data:
  nominatim-data:
  nominatim-serve-data:

networks:
  nominatim-net:
    name: nominatim-net
