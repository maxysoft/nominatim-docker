# For a full planet instance, we apply some best practices from the documentation (like using a flatnode file).
# This compose file uses bind mounts, so it'll reference /data. You can either also mount the storage (for DB + flat node file) under /data or change it.
# Flatnode storage is enabled by creating /data/nominatim/flatnode before the import.
# Minimum specification for a machine running the import (if this succeeded on a lower spec machine, please contribute them):
# - 16 core CPU (set THREADS variable to number of cores/threads available)
# - 64GB RAM
# - 1.5TB (NVMe) SSD storage
#
# nominatim-import (full image) provisions and imports, then exits; nominatim
# (serve image) runs the API with no import tooling or admin credentials;
# nominatim-updater (--profile updates) applies replication diffs. Re-running
# `up` is safe. To import a newer extract into the same database:
#
#   docker compose -f contrib/docker-compose-planet.yml run --rm nominatim-import reimport

x-logging: &logging
  logging:
    driver: "json-file"
    options:
      max-size: 10m
      max-file: "3"

# Hardening shared by every nominatim-ctl container: no setuid binaries remain,
# so privilege escalation is blocked; the capabilities are what the entrypoint
# needs to own the volume, drop privileges and signal its children; only
# /nominatim, /tmp, $HOME (tmpfs) and /dev/shm are written.
x-nominatim: &nominatim
  init: true
  security_opt:
    - no-new-privileges:true
  read_only: true
  tmpfs:
    - /tmp
    - /var/lib/nominatim
  cap_drop:
    - ALL
  cap_add:
    - KILL
    - CHOWN
    - DAC_OVERRIDE
    - FOWNER
    - SETUID
    - SETGID
  networks:
    - nominatim-net
  <<: *logging

# Database connection shared by every nominatim-ctl container.
x-database: &database
  POSTGRES_HOST: nominatim-postgres
  POSTGRES_PORT: 5432
  POSTGRES_DB: nominatim
  NOMINATIM_PASSWORD: ${NOMINATIM_PASSWORD:?set NOMINATIM_PASSWORD in .env}

# Shared by import and updater: both write it into the .env on their common volume.
x-replication: &replication
  REPLICATION_URL: https://ftp5.gwdg.de/pub/misc/openstreetmap/planet.openstreetmap.org/replication/day/

services:
  nominatim-postgres:
    image: postgis/postgis:18-3.6-alpine@sha256:ffcf0c4b904e41b9779f8098007fb5a9484025319c18c70cf8e1bcebb742b9b7
    container_name: nominatim-postgres
    hostname: nominatim-postgres
    restart: unless-stopped
    # PostgreSQL uses /dev/shm for parallel workers; the 64MB default is
    # too small for an import. The API container does not need it.
    shm_size: 1gb
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?set POSTGRES_ADMIN_PASSWORD in .env}
      POSTGRES_USER: postgres
      POSTGRES_DB: nominatim
    volumes:
      - type: bind
        source: /data/db
        target: /var/lib/postgresql
      - type: bind
        source: ./postgres/planet-postgresql.conf
        target: /etc/postgresql/postgresql.conf
        read_only: true
    # PostgreSQL configuration optimized for planet Nominatim import
    # Tuned for 64 GB RAM + NVMe SSD as per minimum spec above
    command: >
      postgres -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    <<: *logging
    networks:
      - nominatim-net

  # Runs once. The image healthcheck probes the API, which this container never runs.
  nominatim-import:
    <<: *nominatim
    image: ghcr.io/maxysoft/nominatim-docker:latest
    container_name: nominatim-import
    command: import
    restart: "no"
    healthcheck:
      disable: true
    environment:
      <<: [*database, *replication]
      POSTGRES_ADMIN_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?set POSTGRES_ADMIN_PASSWORD in .env}
      # https://ftp5.gwdg.de/pub/misc/openstreetmap/planet.openstreetmap.org/pbf/planet-latest.osm.pbf returns 404.
      # Use a specific dated version:
      PBF_URL: https://ftp5.gwdg.de/pub/misc/openstreetmap/planet.openstreetmap.org/pbf/planet-250317.osm.pbf
      IMPORT_WIKIPEDIA: "true"
      IMPORT_US_POSTCODES: "true"
      IMPORT_GB_POSTCODES: "true"
      THREADS: 16
    volumes:
      - type: bind
        source: /data/nominatim
        target: /nominatim
    depends_on:
      nominatim-postgres:
        condition: service_healthy

  # Serve image: no osm2pgsql, no psql, no admin credentials. Own volume: it
  # would otherwise overwrite the .env the updater reads.
  nominatim:
    <<: *nominatim
    image: ghcr.io/maxysoft/nominatim-docker:serve
    container_name: nominatim
    hostname: nominatim
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      <<: *database
    volumes:
      - nominatim-serve-data:/nominatim
    depends_on:
      nominatim-postgres:
        condition: service_healthy
        restart: true
      nominatim-import:
        condition: service_completed_successfully

  # Optional (--profile updates). on-failure: once/catch-up exit 0 when done.
  nominatim-updater:
    <<: *nominatim
    profiles:
      - updates
    image: ghcr.io/maxysoft/nominatim-docker:latest
    container_name: nominatim-updater
    command: replicate
    restart: on-failure
    healthcheck:
      disable: true
    environment:
      <<: [*database, *replication]
      UPDATE_MODE: continuous
    volumes:
      - type: bind
        source: /data/nominatim
        target: /nominatim
    depends_on:
      nominatim-postgres:
        condition: service_healthy
        restart: true
      nominatim-import:
        condition: service_completed_successfully

volumes:
  nominatim-serve-data:

networks:
  nominatim-net:
    name: nominatim-net
